services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    ports:
      # Exposed on localhost so the host-level cloudflared (systemd) can route to it.
      # Add a Public Hostname in the Cloudflare dashboard:
      #   portfolio.willredington.com -> http://localhost:8081
      - "127.0.0.1:8081:80"
