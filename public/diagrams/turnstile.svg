<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-label="Turnstile architecture: a Tauri desktop shell and React CodeMirror UI drive a session pipeline that runs Claude Code in your own checkout through the Claude Agent SDK. The turn loop runs from your message to the agent's edits, a live changed-file list, a review when the turn ends, and notes you send back on your own schedule without the agent ever waiting. Durable state lives in git as a baseline ref written through a scratch index, and the codebase layers from core up through app, adapters and cli with the import graph enforced by a test.">
  <style>
    .bg { fill: #0d0e11; }
    .panel { fill: #131418; stroke: #2a2d34; stroke-width: 1; rx: 10; ry: 10; }
    .panel-accent { fill: #131418; stroke: #d4a574; stroke-width: 1; rx: 10; ry: 10; }
    .panel-header { fill: #6b707c; font: 500 11px 'Inter', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .box { fill: #1c1e23; stroke: #2a2d34; stroke-width: 1; rx: 6; ry: 6; }
    .box-title { fill: #e4e6ea; font: 500 13px 'Inter', sans-serif; }
    .box-sub { fill: #9ea3ae; font: 11px 'Inter', sans-serif; }
    .pipe-title { fill: #d4a574; font: 500 12px 'Inter', sans-serif; }
    .arrow { stroke: #6b707c; stroke-width: 1.2; fill: none; }
    .arrow-accent { stroke: #d4a574; stroke-width: 1.5; fill: none; }
    .label { fill: #9ea3ae; font: 10px 'Inter', sans-serif; }
    .step { fill: #1c1e23; stroke: #3b3f48; stroke-width: 1; rx: 4; ry: 4; }
    .step-text { fill: #c9ccd3; font: 11px 'Inter', sans-serif; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b707c" />
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a574" />
    </marker>
  </defs>

  <rect class="bg" width="920" height="640"/>

  <!-- Surfaces -->
  <text class="panel-header" x="40" y="50">Surface</text>
  <rect class="panel" x="40" y="60" width="230" height="150"/>
  <rect class="box" x="60" y="82" width="190" height="50"/>
  <text class="box-title" x="76" y="104">Tauri desktop shell</text>
  <text class="box-sub" x="76" y="120">Rust · sidecar binary</text>
  <rect class="box" x="60" y="142" width="190" height="50"/>
  <text class="box-title" x="76" y="164">React + CodeMirror</text>
  <text class="box-sub" x="76" y="180">Whole files · notes · rail</text>

  <!-- Session pipeline -->
  <text class="panel-header" x="300" y="50">Pipeline · app/</text>
  <rect class="panel-accent" x="300" y="60" width="280" height="150"/>
  <rect class="box" x="320" y="82" width="240" height="50"/>
  <text class="box-title" x="336" y="104">session · board</text>
  <text class="box-sub" x="336" y="120">Turn state · changed-file list</text>
  <rect class="box" x="320" y="142" width="240" height="50"/>
  <text class="box-title" x="336" y="164">review</text>
  <text class="box-sub" x="336" y="180">One pass per changing turn</text>

  <!-- Agent -->
  <text class="panel-header" x="610" y="50">Agent</text>
  <rect class="panel" x="610" y="60" width="270" height="150"/>
  <rect class="box" x="630" y="82" width="230" height="50"/>
  <text class="box-title" x="646" y="104">Claude Agent SDK</text>
  <text class="box-sub" x="646" y="120">One connection per session</text>
  <rect class="box" x="630" y="142" width="230" height="50"/>
  <text class="box-title" x="646" y="164">Claude Code</text>
  <text class="box-sub" x="646" y="180">Your checkout · scoped write tool</text>

  <path class="arrow" d="M270,135 L300,135" marker-end="url(#arr)"/>
  <path class="arrow" d="M580,135 L610,135" marker-end="url(#arr)"/>

  <!-- The turn -->
  <text class="panel-header" x="40" y="260">The turn</text>
  <rect class="panel-accent" x="40" y="270" width="840" height="130"/>
  <text class="pipe-title" x="60" y="296">Session loop — the agent is never held waiting on you</text>

  <g>
    <rect class="step" x="60" y="312" width="135" height="34"/>
    <text class="step-text" x="72" y="334">your message</text>
    <rect class="step" x="207" y="312" width="125" height="34"/>
    <text class="step-text" x="219" y="334">agent turn</text>
    <rect class="step" x="344" y="312" width="160" height="34"/>
    <text class="step-text" x="356" y="334">changed-file list</text>
    <rect class="step" x="516" y="312" width="165" height="34"/>
    <text class="step-text" x="528" y="334">review · turn end</text>
    <rect class="step" x="693" y="312" width="145" height="34"/>
    <text class="step-text" x="705" y="334">you read + note</text>

    <path class="arrow" d="M195,329 L207,329" marker-end="url(#arr)"/>
    <path class="arrow" d="M332,329 L344,329" marker-end="url(#arr)"/>
    <path class="arrow" d="M504,329 L516,329" marker-end="url(#arr)"/>
    <path class="arrow" d="M681,329 L693,329" marker-end="url(#arr)"/>

    <path class="arrow-accent" d="M765,346 L765,382 L270,382 L270,346" marker-end="url(#arr-accent)"/>
    <text class="label" x="404" y="375">notes go back when you send them</text>
  </g>

  <path class="arrow-accent" d="M440,210 L440,270" marker-end="url(#arr-accent)"/>
  <text class="label" x="450" y="245">drives the turn</text>
  <path class="arrow" d="M745,210 L745,270" marker-end="url(#arr)"/>
  <text class="label" x="755" y="245">runs in your checkout</text>

  <!-- Git -->
  <text class="panel-header" x="40" y="440">Git · the durable state</text>
  <rect class="panel" x="40" y="450" width="430" height="150"/>
  <rect class="box" x="60" y="472" width="185" height="105"/>
  <text class="box-title" x="78" y="496">Baseline ref</text>
  <text class="box-sub" x="78" y="516">refs/turnstile/baselines/</text>
  <text class="box-sub" x="78" y="532">&lt;session id&gt;</text>
  <text class="box-sub" x="78" y="556">Written via scratch index</text>

  <rect class="box" x="265" y="472" width="185" height="105"/>
  <text class="box-title" x="283" y="496">Tree-to-tree delta</text>
  <text class="box-sub" x="283" y="516">Committed + uncommitted</text>
  <text class="box-sub" x="283" y="532">+ untracked</text>
  <text class="box-sub" x="283" y="556">Cumulative per session</text>

  <path class="arrow-accent" d="M250,400 L250,450" marker-end="url(#arr-accent)"/>
  <text class="label" x="260" y="430">diff against baseline</text>

  <text class="label" x="40" y="620">Index, HEAD, stash and reflog untouched · no branches, no commits to yours</text>

  <!-- Layers -->
  <text class="panel-header" x="510" y="440">Layers · enforced</text>
  <rect class="panel" x="510" y="450" width="370" height="150"/>
  <rect class="step" x="530" y="470" width="330" height="26"/>
  <text class="step-text" x="542" y="488">cli/ — composition root</text>
  <rect class="step" x="530" y="502" width="330" height="26"/>
  <text class="step-text" x="542" y="520">adapters/ — agent-sdk · git · model · web · fs</text>
  <rect class="step" x="530" y="534" width="330" height="26"/>
  <text class="step-text" x="542" y="552">app/ — session · board · review</text>
  <rect class="step" x="530" y="566" width="330" height="26"/>
  <text class="step-text" x="542" y="584">core/ — domain types · zero I/O</text>

  <path class="arrow" d="M520,570 L520,470" marker-end="url(#arr)"/>

  <text class="label" x="510" y="620">tests/architecture.test.ts fails the build on an illegal import</text>
</svg>
