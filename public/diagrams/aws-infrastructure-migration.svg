<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-label="AWS infrastructure: developers connect via VPN to a private VPC where Jenkins on EC2 builds and deploys to a private EKS cluster behind an internal load balancer, pulling images from ECR.">
  <style>
    .bg { fill: #0d0e11; }
    .panel { fill: #131418; stroke: #2a2d34; stroke-width: 1; rx: 10; ry: 10; }
    .vpc { fill: none; stroke: #d4a574; stroke-dasharray: 4 4; stroke-width: 1.25; rx: 12; ry: 12; }
    .subnet { fill: #0d0e11; stroke: #3b3f48; stroke-width: 1; stroke-dasharray: 3 3; rx: 8; ry: 8; }
    .box { fill: #1c1e23; stroke: #2a2d34; stroke-width: 1; rx: 6; ry: 6; }
    .box-accent { fill: #1c1e23; stroke: #d4a574; stroke-width: 1; rx: 6; ry: 6; }
    .panel-header { fill: #6b707c; font: 500 11px 'Inter', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .box-title { fill: #e4e6ea; font: 500 13px 'Inter', sans-serif; }
    .box-sub { fill: #9ea3ae; font: 11px 'Inter', sans-serif; }
    .vpc-label { fill: #d4a574; font: 500 12px 'Inter', sans-serif; letter-spacing: 0.08em; }
    .subnet-label { fill: #6b707c; font: 500 10px 'Inter', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .arrow { stroke: #6b707c; stroke-width: 1.2; fill: none; }
    .arrow-accent { stroke: #d4a574; stroke-width: 1.5; fill: none; }
    .label { fill: #9ea3ae; font: 10px 'Inter', sans-serif; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b707c" />
    </marker>
    <marker id="arr2-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a574" />
    </marker>
  </defs>
  <rect class="bg" width="920" height="560"/>

  <!-- Developers -->
  <text class="panel-header" x="40" y="50">Developers</text>
  <rect class="panel" x="40" y="60" width="180" height="160"/>
  <rect class="box" x="60" y="82" width="140" height="46"/>
  <text class="box-title" x="76" y="104">Engineer laptop</text>
  <text class="box-sub" x="76" y="120">git push · kubectl</text>
  <rect class="box-accent" x="60" y="140" width="140" height="60"/>
  <text class="box-title" x="76" y="162">Client VPN</text>
  <text class="box-sub" x="76" y="178">mTLS · SSO</text>
  <text class="box-sub" x="76" y="192">Cert-based trust</text>

  <!-- VPC -->
  <text class="vpc-label" x="260" y="48">VPC · private by default · no public subnets for workloads</text>
  <rect class="vpc" x="260" y="60" width="620" height="420"/>

  <!-- Public edge subnet (NLB / VPN endpoint) -->
  <text class="subnet-label" x="280" y="88">Edge subnet (egress + VPN)</text>
  <rect class="subnet" x="280" y="94" width="220" height="90"/>
  <rect class="box-accent" x="296" y="108" width="188" height="28"/>
  <text class="box-title" x="308" y="126">AWS Client VPN endpoint</text>
  <rect class="box" x="296" y="142" width="90" height="32"/>
  <text class="box-sub" x="308" y="162">NAT GW</text>
  <rect class="box" x="394" y="142" width="90" height="32"/>
  <text class="box-sub" x="406" y="162">IGW</text>

  <!-- CI subnet -->
  <text class="subnet-label" x="280" y="208">CI / Tooling subnet</text>
  <rect class="subnet" x="280" y="214" width="220" height="240"/>
  <rect class="box" x="296" y="232" width="188" height="58"/>
  <text class="box-title" x="310" y="252">Jenkins (EC2)</text>
  <text class="box-sub" x="310" y="268">Declarative pipelines</text>
  <text class="box-sub" x="310" y="282">Ansible-provisioned</text>
  <rect class="box" x="296" y="300" width="188" height="42"/>
  <text class="box-title" x="310" y="320">ECR</text>
  <text class="box-sub" x="310" y="334">Private image registry</text>
  <rect class="box" x="296" y="352" width="188" height="42"/>
  <text class="box-title" x="310" y="372">Secrets Manager</text>
  <text class="box-sub" x="310" y="386">Pipeline credentials</text>
  <rect class="box" x="296" y="404" width="188" height="40"/>
  <text class="box-title" x="310" y="424">S3 (artifacts)</text>
  <text class="box-sub" x="310" y="438">Build outputs, logs</text>

  <!-- EKS subnet -->
  <text class="subnet-label" x="528" y="88">Private EKS cluster · workloads</text>
  <rect class="subnet" x="528" y="94" width="340" height="360"/>
  <rect class="box-accent" x="548" y="114" width="300" height="52"/>
  <text class="box-title" x="564" y="136">EKS control plane</text>
  <text class="box-sub" x="564" y="152">Managed · private endpoint</text>

  <rect class="box" x="548" y="180" width="140" height="86"/>
  <text class="box-title" x="562" y="200">Node group A</text>
  <text class="box-sub" x="562" y="216">Spot + on-demand mix</text>
  <text class="box-sub" x="562" y="230">Hardened AMI</text>

  <rect class="box" x="708" y="180" width="140" height="86"/>
  <text class="box-title" x="722" y="200">Node group B</text>
  <text class="box-sub" x="722" y="216">GPU / special workloads</text>

  <rect class="box" x="548" y="280" width="300" height="70"/>
  <text class="box-title" x="564" y="300">Internal NLB</text>
  <text class="box-sub" x="564" y="316">App-facing · TLS termination at ingress</text>
  <text class="box-sub" x="564" y="332">Accessible only via VPN</text>

  <rect class="box" x="548" y="364" width="300" height="78"/>
  <text class="box-title" x="564" y="384">Observability</text>
  <text class="box-sub" x="564" y="400">CloudWatch, Fluent Bit,</text>
  <text class="box-sub" x="564" y="414">Prometheus / Grafana</text>
  <text class="box-sub" x="564" y="430">Security audit logging</text>

  <!-- Tooling below VPC -->
  <text class="panel-header" x="40" y="280">Infrastructure as code</text>
  <rect class="panel" x="40" y="290" width="180" height="190"/>
  <rect class="box" x="60" y="312" width="140" height="42"/>
  <text class="box-title" x="76" y="332">AWS CDK</text>
  <text class="box-sub" x="76" y="346">TypeScript stacks</text>
  <rect class="box" x="60" y="360" width="140" height="42"/>
  <text class="box-title" x="76" y="380">CloudFormation</text>
  <text class="box-sub" x="76" y="394">Drift detection</text>
  <rect class="box" x="60" y="408" width="140" height="42"/>
  <text class="box-title" x="76" y="428">Ansible</text>
  <text class="box-sub" x="76" y="442">Host bootstrapping</text>

  <!-- Arrows -->
  <path class="arrow-accent" d="M200,170 L260,170" marker-end="url(#arr2-accent)"/>
  <path class="arrow" d="M200,332 C240,332 260,300 280,260" marker-end="url(#arr2)"/>
  <path class="arrow" d="M484,260 L548,240" marker-end="url(#arr2)"/>
  <text class="label" x="492" y="232">deploy</text>
  <path class="arrow" d="M484,321 L548,321" marker-end="url(#arr2)"/>
  <text class="label" x="492" y="312">pull image</text>
  <path class="arrow" d="M400,142 L400,184" marker-end="url(#arr2)"/>
</svg>
