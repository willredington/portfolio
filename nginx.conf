server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Logs go to stdout/stderr by default in the nginx:alpine image

  # Security headers
  add_header X-Frame-Options            "SAMEORIGIN"         always;
  add_header X-Content-Type-Options     "nosniff"            always;
  add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

  # Gzip — brotli would be better but requires a custom nginx build
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # Hashed/built assets: immutable, long cache
  location ^~ /_assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fonts + images (non-hashed): cache but revalidate
  location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    access_log off;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # PDF resume: cache but short — replaceable
  location = /resume.pdf {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Clean URLs: serve /case-studies/foo from /case-studies/foo/index.html
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Never leak hidden files
  location ~ /\.(?!well-known) {
    deny all;
  }
}
